<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EDDC">
<meta name="color-scheme" content="only light">  <!-- 폰 야간(다크) 모드가 색을 억지로 뒤집지 않게: 이 앱은 밝은 화면 하나만 써요 -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="" data-t-content="inst.meta.desc">
<title data-t="inst.meta.title"></title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/tokens-extra.css">
<link rel="stylesheet" href="css/install.css">
</head>
<body class="jn-app inst">
<!-- 화면 글자는 lang/ko.js 에 있어요 (data-t="키", **굵게** 는 data-t-rich) -->
<main class="inst-wrap">
  <a class="jn-btn inst-back" href="index.html" id="backLink" data-t="inst.back"></a>

  <header class="inst-head">
    <img src="icons/icon-192.png" width="96" height="96" alt="" class="inst-icon">
    <h1 data-t="inst.title"></h1>
    <p class="sub" data-t="inst.sub"></p>
  </header>

  <section class="inst-card jn-card" aria-labelledby="stateTitle">
    <h2 id="stateTitle" data-t="inst.state.title"></h2>
    <p id="stateText" class="inst-state" role="status" aria-live="polite" data-t="inst.state.checking"></p>
    <button class="jn-btn jn-btn--primary jn-btn--block" type="button" id="installBtn" data-t="install.btn" hidden></button>
    <p class="inst-small" id="installResult" role="status" aria-live="polite"></p>
  </section>

  <h2 class="inst-sec" data-t="inst.devices"></h2>
  <div class="inst-list" id="devices">

    <section class="inst-card jn-card" id="dev-android" data-dev="android" aria-labelledby="t-android">
      <h3 id="t-android"><span data-t="inst.android.title"></span> <span class="mine-tag" data-t="inst.mine" hidden></span></h3>
      <ol>
        <li data-t-rich="inst.android.1"></li>
        <li data-t-rich="inst.android.2"></li>
        <li data-t-rich="inst.android.3"></li>
        <li data-t-rich="inst.android.4"></li>
      </ol>
    </section>

    <section class="inst-card jn-card" id="dev-ios" data-dev="ios" aria-labelledby="t-ios">
      <h3 id="t-ios"><span data-t="inst.ios.title"></span> <span class="mine-tag" data-t="inst.mine" hidden></span></h3>
      <ol>
        <li data-t-rich="inst.ios.1"></li>
        <li data-t-rich="inst.ios.2"></li>
        <li data-t-rich="inst.ios.3"></li>
        <li data-t-rich="inst.ios.4"></li>
      </ol>
      <p class="inst-small" data-t="inst.ios.small"></p>
    </section>

    <section class="inst-card jn-card" id="dev-pc" data-dev="pc" aria-labelledby="t-pc">
      <h3 id="t-pc"><span data-t="inst.pc.title"></span> <span class="mine-tag" data-t="inst.mine" hidden></span></h3>
      <ol>
        <li data-t-rich="inst.pc.1"></li>
        <li data-t-rich="inst.pc.2"></li>
        <li data-t-rich="inst.pc.3"></li>
        <li data-t-rich="inst.pc.4"></li>
      </ol>
      <p class="inst-small" data-t="inst.pc.small"></p>
    </section>
  </div>

  <section class="inst-card jn-card" aria-labelledby="t-know">
    <h3 id="t-know" data-t="inst.know.title"></h3>
    <ul>
      <li data-t="inst.know.0"></li>
      <li data-t-rich="inst.know.1"></li>
      <li data-t-rich="inst.know.2"></li>
      <li data-t="inst.know.3"></li>
      <li data-t="inst.know.4"></li>
      <li data-t="inst.know.5"></li>
    </ul>
  </section>
</main>
<script src="lang/ko.js"></script>
<script>window.JN_LANG = "ko";</script>
<script src="js/i18n.js"></script>
<script src="js/install.js"></script>
<script src="js/install-page.js"></script>
</body>
</html>
