<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EDDC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="" data-t-content="meta.title">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="" data-t-content="meta.desc">
<title data-t="meta.title"></title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/tokens-extra.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/games.css">
</head>
<body class="jn-app">

<!-- 화면에 보이는 글자는 lang/ko.js 에 있어요. data-t="키" 는 그 문구로, data-t-aria 는 aria-label 로 채워져요 (js/i18n.js) -->

<!-- 1. 누가 놀까요? -->
<section id="scr-who" class="screen who" aria-label="" data-t-aria="who.aria">
  <div class="bg" id="whoBg" aria-hidden="true"></div>
  <button class="jn-iconbtn jn-iconbtn--parent lock" type="button" data-act="parent" aria-label="" data-t-aria="parent.title" data-icon="보호자"></button>
  <div class="who__head"><div class="bomi-say"><div class="m jn-float" data-owl="웃음,인사"></div><div class="jn-bubble jn-bubble--left" id="whoBubble" data-t="who.bubble.hello"></div></div></div>
  <h1 class="ttl" id="whoTitle" data-t="who.title"></h1>
  <div class="kids" id="kids"></div>
  <p class="note" data-t="who.disclaim"></p>
  <p class="note" data-t="who.note"></p>
</section>

<!-- 2. 영역 방 7개 -->
<section id="scr-home" class="screen rooms" aria-label="" data-t-aria="home.aria">
  <div class="jn-topbar page-inner">
    <button class="me" type="button" data-act="who" aria-label="" data-t-aria="home.switch.aria"><i id="homeAv"></i><span id="homeTitle" data-t="home.title.default"></span></button>
    <button class="jn-iconbtn jn-iconbtn--parent" type="button" data-act="parent" aria-label="" data-t-aria="parent.title" data-icon="보호자"></button>
  </div>
  <div class="rooms__hello page-inner"><span class="m" data-owl="기본,가리키기"></span><h1 class="ttl" data-t="home.hello"></h1></div>
  <div class="today page-inner" id="todayBox" hidden><p class="today__label" data-t="home.today"></p><div class="games" id="todayCard"></div></div>
  <div class="roomgrid page-inner" id="rooms"></div>
</section>

<!-- 2-1. 방 안 -->
<section id="scr-room" class="screen room" aria-label="" data-t-aria="room.aria">
  <div class="jn-topbar page-inner">
    <button class="jn-iconbtn" type="button" data-act="home" aria-label="" data-t-aria="room.back.aria" data-icon="뒤로"></button>
    <span class="jn-topbar__title"></span>
    <button class="jn-iconbtn jn-iconbtn--parent" type="button" data-act="parent" aria-label="" data-t-aria="parent.title" data-icon="보호자"></button>
  </div>
  <div class="room-body page-inner">
    <div class="band" id="roomBand"></div>
    <div class="room-main">
      <div class="room-intro"><h1 class="ttl"><i id="roomIcon"></i><span id="roomName"></span></h1><p class="sub" id="roomPower"></p></div>
      <div class="games" id="gameCards"></div>
      <div class="guide"><div class="jn-bubble" id="roomTip" data-t="room.tip"></div><span class="m" data-owl="웃음,기본"></span></div>
      <p class="note" data-t="room.note"></p>
    </div>
  </div>
</section>

<!-- 3. 놀이 공통 틀 -->
<section id="scr-play" class="screen play" aria-label="" data-t-aria="play.aria">
  <div class="frame-top">
    <button class="jn-iconbtn" type="button" data-act="room" aria-label="" data-t-aria="play.back.aria" data-icon="홈"></button>
    <div class="t"><b id="playTitle"></b><span class="jn-stage" id="stageChip"></span></div>
    <button class="jn-iconbtn" type="button" id="soundBtn" aria-label="" data-t-aria="play.sound" aria-pressed="false"></button>
    <button class="jn-iconbtn jn-iconbtn--parent" type="button" data-act="parent-game" aria-label="" data-t-aria="parent.title" data-icon="보호자"></button>
  </div>
  <div class="play-wrap">
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="intro" id="intro" hidden>
        <div class="intro-in"><div class="m" data-owl="웃음,가리키기"></div><div class="jn-bubble jn-bubble--left" id="introText"></div></div>
      </div>
    </div>
    <div class="side">
      <div class="mission jn-paper"><i id="missionIcon"></i><span id="msgLine" role="status" aria-live="polite"></span></div>
      <div class="frame-bottom">
        <div class="track"><span id="playStatus" class="play-status"></span><span class="timer jn-num" id="timerBox"><i data-icon="시계"></i><span id="timerText">0.0</span></span></div>
        <div class="bottom-left" id="bottomLeft"></div>
        <span class="m side-owl" id="sideOwl" aria-hidden="true"></span>
        <button class="hintbtn" type="button" id="hintBtn" aria-label="" data-t-aria="play.hint" data-icon="힌트" hidden></button>
      </div>
    </div>
  </div>
</section>

<!-- 4. 칭찬 -->
<div id="praise" class="overlay full scene-scr" hidden>
  <div class="bg" aria-hidden="true"><span class="tall" id="praiseBgTall"></span><span class="wide" id="praiseBgWide"></span></div>
  <div class="center praise" role="status" aria-live="polite">
    <div class="big-stars" id="praiseStars"></div>
    <div class="hero jn-pop" id="praiseOwl"></div>
    <div class="card jn-card">
      <h1 id="praiseTitle" data-t="praise.title.default"></h1>
      <p class="praise-line" id="praiseLine"></p>
      <div class="chips"><span class="chip jn-num" id="praiseTime"><i data-icon="시계"></i><span></span></span><span class="chip best" id="praiseBest" data-t="praise.best"></span></div>
      <div class="autonext" id="autoNext"><span id="autoNextText" data-t="praise.autonext.next"></span><i><b id="autoNextBar"></b></i></div>
      <div class="nextrow" id="nextRow" hidden>
        <button class="jn-btn jn-btn--primary" type="button" id="nextAgain" data-t="praise.next.again"></button>
        <button class="jn-btn" type="button" id="nextOther" data-t="praise.next.other"></button>
        <button class="jn-btn jn-btn--quiet" type="button" id="nextRest" data-t="praise.next.rest"></button>
      </div>
      <div class="suggest" id="suggest" hidden>
        <p id="suggestText"></p>
        <button class="jn-btn jn-btn--primary" type="button" id="suggestYes"></button>
        <button class="jn-btn jn-btn--quiet" type="button" id="suggestNo" data-t="praise.suggest.no"></button>
      </div>
      <div class="again" id="againBox" hidden>
        <p data-t="praise.again.ask"></p>
        <button class="jn-btn jn-btn--primary" type="button" id="againYes" data-t="praise.again.yes"></button>
        <button class="jn-btn jn-btn--quiet" type="button" id="againNo" data-t="praise.again.no"></button>
      </div>
      <div class="alldone" id="allDone" hidden>
        <button class="jn-btn jn-btn--primary" type="button" id="allAgain" data-t="praise.all.again"></button>
        <button class="jn-btn" type="button" id="allSame" data-t="praise.all.same"></button>
        <button class="jn-btn jn-btn--quiet" type="button" id="allRoom" data-t="praise.all.room"></button>
      </div>
    </div>
  </div>
</div>

<!-- 5. 잠깐 쉬어요 -->
<div id="rest" class="overlay full scene-scr rest-scr" hidden>
  <div class="bg" aria-hidden="true"><span class="tall" id="restBgTall"></span><span class="wide" id="restBgWide"></span></div>
  <div class="center rest">
    <div class="card jn-card"><h1 id="restTitle" data-t="rest.title.default"></h1><p data-t="rest.text"></p></div>
    <div class="breath"><span class="fill"></span><span class="ring" id="breathRing"></span><b id="breathText" data-t="rest.in"></b></div>
    <div class="dal" data-snail="쉬어요,기지개"></div>
    <div class="rest-btns">
      <button class="jn-btn jn-btn--primary rest-go" type="button" id="restGo" data-t="rest.go" hidden></button>
      <button class="jn-btn jn-btn--quiet" type="button" id="restRoom" data-t="rest.room"></button>
    </div>
  </div>
</div>

<!-- 5-1. 눈 쉬기 (부엉이, 20초). 깜빡임 없는 차분한 화면 -->
<div id="eyeRest" class="overlay full eye-scr" hidden>
  <div class="eye-in" role="status" aria-live="polite">
    <div class="eye-owl" id="eyeOwl" aria-hidden="true"></div>
    <h1 id="eyeTitle" data-t="eye.title.default"></h1>
    <p id="eyeText" data-t="eye.text"></p>
    <p class="eye-count"><b class="jn-num" id="eyeCount">20</b><span data-t="eye.unit"></span></p>
    <button class="jn-btn jn-btn--primary" type="button" id="eyeGo" data-t="eye.go" hidden></button>
    <button class="jn-btn jn-btn--quiet" type="button" id="eyeRoom" data-t="eye.room"></button>
  </div>
</div>

<!-- 5-2. 오늘 놀이 시간이 다 됐어요 (보호자가 정한 하루 시간) -->
<div id="timeUp" class="overlay full eye-scr" hidden>
  <div class="eye-in" role="status" aria-live="polite">
    <div class="eye-owl" id="timeUpOwl" aria-hidden="true"></div>
    <h1 data-t="timeup.title"></h1>
    <p data-t="timeup.text"></p>
    <button class="jn-btn jn-btn--primary" type="button" id="timeUpBye" data-t="timeup.bye"></button>
  </div>
</div>

<!-- 5-3. 놀이 도중 멈췄어요 (화면을 껐다 켜거나 다른 앱에 갔다 왔을 때): 이어서 / 처음부터. 깜빡임·소리 없음 -->
<div id="pauseBox" class="overlay full eye-scr" hidden>
  <div class="eye-in" role="alertdialog" aria-labelledby="pauseTitle">
    <div class="eye-owl" id="pauseOwl" aria-hidden="true"></div>
    <h1 id="pauseTitle" data-t="pause.title"></h1>
    <p id="pauseText" data-t="pause.text"></p>
    <button class="jn-btn jn-btn--primary jn-btn--big" type="button" id="pauseGo" data-t="pause.go"></button>
    <button class="jn-btn jn-btn--quiet" type="button" id="pauseRestart" data-t="pause.restart"></button>
  </div>
</div>

<!-- 5-4. 새로고침·앱이 다시 켜진 뒤: 아까 놀던 놀이를 이어서 놀까요? -->
<div id="resumeBox" class="overlay full eye-scr" hidden>
  <div class="eye-in" role="alertdialog" aria-labelledby="resumeTitle">
    <div class="eye-owl" id="resumeOwl" aria-hidden="true"></div>
    <h1 id="resumeTitle" data-t="resume.title"></h1>
    <p id="resumeText"></p>
    <button class="jn-btn jn-btn--primary jn-btn--big" type="button" id="resumeGo" data-t="pause.go"></button>
    <button class="jn-btn jn-btn--quiet" type="button" id="resumeNew" data-t="pause.restart"></button>
  </div>
</div>

<!-- 5-5. 처음 안내 (3장, 건너뛰기 가능, 한 번 보면 다시 안 떠요. 글자는 lang/ko.js 의 onb.*) -->
<div id="onboard" class="overlay full eye-scr onb" hidden>
  <div class="eye-in onb-in" role="dialog" aria-labelledby="onbTitle">
    <div class="eye-owl" id="onbOwl" aria-hidden="true"></div>
    <p class="onb-step jn-num" id="onbStep"></p>
    <h1 id="onbTitle"></h1>
    <ul class="onb-list" id="onbList"></ul>
    <div class="onb-btns">
      <button class="jn-btn jn-btn--quiet" type="button" id="onbBack" data-t="onb.back"></button>
      <button class="jn-btn jn-btn--primary jn-btn--big" type="button" id="onbNext"></button>
    </div>
    <button class="jn-btn jn-btn--quiet" type="button" id="onbSkip" data-t="onb.skip"></button>
  </div>
</div>

<!-- 새 버전 알림: 새 파일이 준비됐을 때만 보여요 (놀이 중에는 숨김) -->
<button class="jn-btn jn-btn--primary update-btn" type="button" id="updateBtn" data-t="update.btn" hidden></button>

<!-- 곧 열려요 (달팽이) -->
<div id="soon" class="overlay dim" hidden>
  <div class="dialog jn-card" role="dialog" aria-labelledby="soonTitle">
    <div class="mas" data-snail="웃음,인사"></div>
    <h2 id="soonTitle" data-t="soon.title"></h2>
    <p id="soonText"></p>
    <button class="jn-btn jn-btn--primary" type="button" data-act="close-soon" data-t="soon.ok"></button>
  </div>
</div>

<!-- 6. 보호자 잠금 -->
<section id="scr-lock" class="screen lock-scr" aria-label="" data-t-aria="lock.aria">
  <button class="jn-iconbtn close" type="button" id="lockBack" aria-label="" data-t-aria="common.close" data-icon="닫기"></button>
  <div class="lockcard jn-card">
    <div class="ic" data-icon="보호자"></div>
    <h1 data-t="lock.title"></h1>
    <p data-t="lock.text"></p>
    <div class="q jn-num"><span id="lockQ"></span><span class="ans" id="lockAns"><span class="box" id="lockBox"></span><span class="val" id="lockVal"></span></span></div>
    <div class="pad" id="keypad"></div>
  </div>
</section>

<!-- 아이 추가·고치기 -->
<section id="scr-profile" class="screen settings" aria-label="" data-t-aria="prof.aria">
  <div class="jn-topbar page-inner"><button class="jn-iconbtn" type="button" id="profBack" aria-label="" data-t-aria="common.close" data-icon="닫기"></button><h2 class="jn-topbar__title" id="profTitle" data-t="prof.title.add"></h2><span class="spacer"></span></div>
  <div class="page form">
    <section class="setcard jn-card">
      <label class="field-label" for="profNick" data-t="prof.nick"></label>
      <input id="profNick" class="text-in" type="text" maxlength="8" autocomplete="off" placeholder="" data-t-ph="prof.nick.ph" aria-describedby="profNote">
      <p class="care" id="profNote" data-t="prof.note"></p>
      <div class="field-label" data-t="prof.animal"></div>
      <div class="pick-grid" id="profAnimals" role="group" aria-label="" data-t-aria="prof.animal.aria"></div>
      <div class="field-label" data-t="prof.color"></div>
      <div class="pick-colors" id="profColors" role="group" aria-label="" data-t-aria="prof.color.aria"></div>
      <div class="jn-row"><span class="lbl"><b data-t="prof.age"></b></span><span class="stepper"><button type="button" id="ageMinus" aria-label="" data-t-aria="prof.age.minus">−</button><b id="ageVal" class="jn-num">5</b><button type="button" id="agePlus" aria-label="" data-t-aria="prof.age.plus">+</button></span></div>
      <p class="care" data-t="prof.age.note"></p>
    </section>
    <button class="jn-btn jn-btn--primary jn-btn--block" type="button" id="profSave" data-t="prof.save"></button>
    <button class="jn-btn jn-btn--quiet jn-btn--block" type="button" id="profDelete" data-t="prof.delete" hidden></button>
  </div>
</section>

<!-- 6-1. 보호자 설정 -->
<section id="scr-parent" class="screen settings" aria-label="" data-t-aria="parent.title">
  <div class="jn-topbar page-inner">
    <button class="jn-iconbtn" type="button" id="parentClose" aria-label="" data-t-aria="common.close" data-icon="닫기"></button>
    <h2 class="jn-topbar__title" data-t="parent.title"></h2>
    <button class="jn-iconbtn" type="button" id="toRecords" aria-label="" data-t-aria="parent.records.aria" data-icon="기록"></button>
  </div>
  <div class="kidtabs page-inner" id="parentTabs"></div>
  <div class="page" id="parentBody"></div>
</section>

<!-- 기록 보기 -->
<section id="scr-records" class="screen settings" aria-label="" data-t-aria="rec.aria">
  <div class="jn-topbar page-inner">
    <button class="jn-iconbtn" type="button" id="recBack" aria-label="" data-t-aria="rec.back.aria" data-icon="뒤로"></button>
    <h2 class="jn-topbar__title" data-t="rec.title"></h2><span class="spacer"></span>
  </div>
  <div class="kidtabs page-inner" id="recTabs"></div>
  <div class="page" id="recBody"></div>
</section>

<!-- 언어 파일: 화면 글자는 모두 여기 있어요. 다른 언어를 쓰려면 lang/en.js 같은 파일을 하나 더 불러오고 아래 JN_LANG 의 "ko" 를 "en" 으로 바꿔요 (README "다른 언어 추가") -->
<script src="lang/ko.js"></script>
<script>window.JN_LANG = "ko";</script>
<script src="js/i18n.js"></script>
<!-- 사진 단계(다른 그림 찾기 7~8단계)용 목록. 사진을 넣는 방법은 photos/사진목록.js 안에 적혀 있어요. -->
<script src="photos/사진목록.js"></script>
<!-- perfect-freehand 는 art.js 보다 먼저 (붓선) -->
<script src="vendor/perfect-freehand.js"></script>
<script src="vendor/rough.js"></script>
<script src="js/art.js"></script>
<script src="js/config.js"></script>
<script src="js/install.js"></script>
<script src="js/assets.js"></script>
<script src="js/store.js"></script>
<script src="js/core.js"></script>
<script src="js/games/number.js"></script>
<script src="js/games/bee.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/light.js"></script>
<script src="js/games/spot.js"></script>
<script src="js/games/shape.js"></script>
<script src="js/games/pattern.js"></script>
<script src="js/games/half.js"></script>
<script src="js/games/maze.js"></script>
<!-- 말·언어 · 몸·감각 (bodytogether.js 는 bodymove.js 의 몸놀이 카드 틀을 같이 써요 → 순서 지키기) -->
<script src="js/games/word.js"></script>
<script src="js/games/bodymove.js"></script>
<script src="js/games/bodytogether.js"></script>
<script src="js/games/sentence.js"></script>
<script src="js/games/emotion.js"></script>
<script src="js/games/changed.js"></script>
<script src="js/games/puzzle.js"></script>
<script src="js/games/dalrong.js"></script>
<script src="js/games/leaf.js"></script>
<script src="js/games/mail.js"></script>
<script src="js/games/order.js"></script>
<script src="js/games/gone.js"></script>
<script src="js/games/sound.js"></script>
<script src="js/games/errand.js"></script>
<script src="js/games/situation.js"></script>
<script src="js/app.js"></script>
<script src="js/records.js"></script>
</body>
</html>
